appId: com.hartmannstudios.driftfeed
---
# Store screenshots for Driftfeed. The feed is generated by a real small model
# (qwen2.5:1.5b) served by Ollama on the CI host (10.0.2.2 from the emulator).
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Let's go"
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "Let's go"
- extendedWaitUntil:
    visible: "Display name"
    timeout: 20000
- tapOn: "Display name"
- inputText: "Maya"
- tapOn: "Handle"
- inputText: "maya_drift"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Bring your brain"
    timeout: 20000
- tapOn: "Use Ollama"
- tapOn: "Ollama base URL"
- inputText: "http://10.0.2.2:11434"
- tapOn: "Model name"
- inputText: "qwen2.5:1.5b"
- hideKeyboard
- tapOn: "Test connection"
- extendedWaitUntil:
    visible: "Test again"
    timeout: 120000
- takeScreenshot: 02-model-setup
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    optional: true
- tapOn:
    text: "Continue"
    enabled: true
- extendedWaitUntil:
    visible:
      text: "Open my feed"
      enabled: true
    timeout: 300000
- takeScreenshot: 03-tour
- tapOn: "Open my feed"
- extendedWaitUntil:
    visible: "zz-never-shown-zz"
    timeout: 150000
    optional: true
- takeScreenshot: 04-feed
- swipe:
    direction: UP
    duration: 600
- extendedWaitUntil:
    visible: "zz-never-shown-zz"
    timeout: 60000
    optional: true
- takeScreenshot: 05-feed-more
